name: CI

on:
  push:
    # preview publishes the draft at /preview/ and leaves the site root alone: the job
    # below builds the root from master whatever ref started it.
    branches: [master, preview]
  pull_request:
  # So the site can be republished without an empty commit — after changing a Pages
  # setting, or after tagging a commit that master has already moved past.
  workflow_dispatch:

# A release tag deliberately does not trigger this. The github-pages environment admits
# branches it has been told about and nothing else, so a tag push would fail the
# protection rule; and since a tag is pushed with the commit it names, the branch push
# already republishes the archive. Tagging an old commit on its own is the one case left,
# and that is what running the workflow by hand is for.

# The project has no dependencies, so there is nothing to install and nothing to cache.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # A directory argument is resolved as a module since Node 24; pass the glob.
      - run: node --test tests/*.test.js
      - name: The single-file build must succeed and be self-contained
        run: node tools/build.mjs

  pages:
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/preview'
    runs-on: ubuntu-latest
    # Two branches can publish, so two runs can want the site at once. Queue rather than
    # cancel: every deploy publishes the whole site, and the loser of a race would leave
    # the newer one's work half done.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Always publish master, whatever triggered the run. This is what makes a push
          # to preview safe: it cannot move the page the public sees, only /preview/.
          ref: master
          # Every released tag and the preview branch are rebuilt from their own source on
          # each deploy, so this needs the whole history and every ref, not just the tip.
          fetch-depth: 0
      # fetch-depth 0 already brings every branch; this is the belt to that braces, and
      # it must not fail the run when there is no preview to fetch.
      - name: Make sure the preview branch is here, if there is one
        run: git fetch --no-tags origin +refs/heads/preview:refs/remotes/origin/preview || true
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # Note what this cannot do: the script that runs is always *master's*, so a preview
      # push can change what a page contains but not which pages exist. A new page appears
      # on the site only once the release script that knows about it is on master.
      - name: Build the site, the archive, and the preview if one is pushed
        run: node tools/release.mjs _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
