name: CI

on:
  push:
    branches: [master]
  pull_request:
  # So the site can be republished without an empty commit — after changing a Pages
  # setting, or after tagging a commit that master has already moved past.
  workflow_dispatch:

# A release tag deliberately does not trigger this. Only master may deploy to the
# github-pages environment, so a tag push would fail the protection rule; and since a tag
# is pushed with the commit it names, the branch push already republishes the archive.
# Tagging an old commit on its own is the one case left, and that is what running the
# workflow by hand is for.

# The project has no dependencies, so there is nothing to install and nothing to cache.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # A directory argument is resolved as a module since Node 24; pass the glob.
      - run: node --test tests/*.test.js
      - name: The single-file build must succeed and be self-contained
        run: node tools/build.mjs

  pages:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Always publish master, whatever triggered the run: a tag push must add to the
          # archive without dragging the root back to an older version.
          ref: master
          # Every released tag is rebuilt from its own source on each deploy, so the
          # archive under /v/ needs the whole history, not just the tip.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build the current page and a frozen copy of every released version
        run: node tools/release.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
