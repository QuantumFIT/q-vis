name: CI

on:
  push:
    branches: [master]
  pull_request:
  # So the site can be republished without an empty commit — after changing a Pages
  # setting, for instance.
  workflow_dispatch:

# The project has no dependencies, so there is nothing to install and nothing to cache.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # A directory argument is resolved as a module since Node 24; pass the glob.
      - run: node --test tests/*.test.js
      - name: The single-file build must succeed and be self-contained
        run: node tools/build.mjs

  pages:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Build the self-contained page and serve it as the site root
        run: |
          node tools/build.mjs
          mkdir -p _site
          cp q-vis.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
