<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>q-vis — MTBDD state evolution</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%223.4%22%20r%3D%222.4%22%20fill%3D%22none%22%20stroke%3D%22%2314202a%22%20stroke-width%3D%221.4%22%2F%3E%3Cpath%20d%3D%22M6.6%205.4%204.2%2010.2%22%20stroke%3D%22%2314202a%22%20stroke-width%3D%221.2%22%20stroke-dasharray%3D%222%201.4%22%20fill%3D%22none%22%2F%3E%3Cpath%20d%3D%22M9.4%205.4%2011.8%2010.2%22%20stroke%3D%22%2314202a%22%20stroke-width%3D%221.2%22%20fill%3D%22none%22%2F%3E%3Crect%20x%3D%221.4%22%20y%3D%2210.8%22%20width%3D%225.4%22%20height%3D%224.2%22%20rx%3D%220.8%22%20fill%3D%22none%22%20stroke%3D%22%2314202a%22%20stroke-width%3D%221.2%22%2F%3E%3Crect%20x%3D%229.2%22%20y%3D%2210.8%22%20width%3D%225.4%22%20height%3D%224.2%22%20rx%3D%220.8%22%20fill%3D%22none%22%20stroke%3D%22%23a8175f%22%20stroke-width%3D%221.2%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="src/app.css">
</head>
<body>
<div class="app">
  <header class="masthead">
    <span class="wordmark">q<span>-</span>vis</span>
    <span class="tagline">how the decision diagram of a quantum state changes, gate by gate</span>
    <span class="spacer"></span>
    <select id="ampFormat" title="how amplitudes are written">
      <option value="exact">exact</option>
      <option value="rect">decimal</option>
      <option value="polar-deg">polar (°)</option>
      <option value="polar-rad">polar (rad)</option>
      <option value="polar-pi">polar (π)</option>
      <option value="tuple">tuple (a,b,c,d)</option>
    </select>
    <button id="theme" type="button" title="theme">◐</button>
    <select id="view" title="how to draw the state">
      <option value="reduced">reduced diagram</option>
      <option value="tree">full tree</option>
      <option value="edge-valued">edge-valued</option>
      <option value="tree-edge-valued">full tree, edge-valued</option>
    </select>
    <label class="toggle"><input type="checkbox" id="hideZero" title="hide the 0 terminal, and in the edge-valued form the 0-weighted edges — a zero subfunction has no node there"> hide zeros</label>
  </header>

  <section class="inputs">
    <div class="panel" style="flex:1 1 auto">
      <header>
        <span class="label">Circuit</span>
        <span class="spacer"></span>
        <button id="help" type="button" title="which gates are supported, and how to write them">gates</button>
        <select id="example" aria-label="load an example"></select>
      </header>
      <textarea id="qasm" spellcheck="false" aria-label="circuit in OpenQASM 2.0"></textarea>
    </div>

    <div class="panel">
      <header>
        <span class="label">Input state</span>
        <span class="spacer"></span>
        <button id="symbolic" type="button">all symbolic</button>
        <span class="hint" title="One line per basis pattern. '-' matches either value of a qubit. '?' as the amplitude gives every matched state its own symbol: a, b, c, ... while the letters last, then named after the basis state. Amplitudes: integers, i, sqrt2, omega (= e^(iπ/4)) and free symbols with + - * / ^; division must stay exact.">basis : amplitude</span>
      </header>
      <textarea id="stateText" spellcheck="false" aria-label="input state"></textarea>
      <p class="note" id="note"></p>
      <p class="error" id="error" role="alert"></p>
    </div>

    <div class="panel" style="flex:1 1 auto">
      <header>
        <span class="label">Amplitudes</span>
        <span class="spacer"></span>
        <span class="hint">– is either value</span>
      </header>
      <div id="readout"></div>
    </div>
  </section>

  <main class="plate">
    <nav class="circuit" id="circuit" aria-label="circuit; click a column to jump to that step"></nav>
    <div class="canvas" id="canvas"></div>
  </main>

  <footer class="transport">
    <button id="prev" title="previous gate (← / Home)">‹</button>
    <button id="play" title="play through the circuit (space)">▶</button>
    <button id="next" title="next gate (→ / End)">›</button>
    <span class="stat" id="position"></span>
    <span class="spacer"></span>
    <span class="stat" id="stats"></span>
    <span class="spacer"></span>
    <button id="zoomOut" title="zoom out (−)">−</button>
    <button id="zoomLevel" title="fit the whole diagram in view (0)">fit</button>
    <button id="zoomIn" title="zoom in (+)">+</button>
    <button id="permalink" title="copy a link to this circuit, state and step">copy link</button>
    <button id="export" title="save the current diagram as an SVG file">export SVG</button>
  </footer>

  <dialog id="helpDialog" aria-labelledby="helpTitle">
    <header>
      <span class="label" id="helpTitle">Gates and syntax</span>
      <span class="spacer"></span>
      <button id="helpClose" type="button">close</button>
    </header>
    <div id="helpBody"></div>
  </dialog>
</div>
<script type="module">
  import { boot } from './src/ui.js';
  boot();
</script>
</body>
</html>
