<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- Replaced by tools/build.mjs with the tag being built; see docs/VERSIONS.md. -->
<meta name="q-vis-version" content="dev">
<title>q-vis/aut — sets of quantum states as tree automata</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Ccircle%20cx%3D%228%22%20cy%3D%223.4%22%20r%3D%222.4%22%20fill%3D%22none%22%20stroke%3D%22%2314202a%22%20stroke-width%3D%221.4%22%2F%3E%3Cpath%20d%3D%22M6.6%205.4%204.2%2010.2%22%20stroke%3D%22%2314202a%22%20stroke-width%3D%221.2%22%20fill%3D%22none%22%2F%3E%3Cpath%20d%3D%22M9.4%205.4%2011.8%2010.2%22%20stroke%3D%22%2314202a%22%20stroke-width%3D%221.2%22%20fill%3D%22none%22%2F%3E%3Ccircle%20cx%3D%223.4%22%20cy%3D%2212.2%22%20r%3D%222.4%22%20fill%3D%22none%22%20stroke%3D%22%2314202a%22%20stroke-width%3D%221.4%22%2F%3E%3Ccircle%20cx%3D%2212.6%22%20cy%3D%2212.2%22%20r%3D%222.4%22%20fill%3D%22none%22%20stroke%3D%22%23a8175f%22%20stroke-width%3D%221.4%22%2F%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="src/app.css">
<link rel="stylesheet" href="src/aut.css">
</head>
<body>
<div class="app">
  <header class="masthead">
    <span class="wordmark">q<span>-</span>vis<span>/</span>aut</span>
    <a id="version" class="version"></a>
    <span class="tagline">sets of quantum states, as tree automata</span>
    <span class="spacer"></span>
    <a id="sibling" class="footnote" href="../"
       title="the decision-diagram tool: one state, drawn gate by gate">one state? q-vis</a>
    <button id="theme" type="button" title="theme">◐</button>
  </header>

  <section class="inputs" id="inputs">
    <div class="panel" id="panelCircuit" data-flex="1 1 auto" style="flex:1 1 auto">
      <header>
        <span class="label">Circuit</span>
        <span class="spacer"></span>
      </header>
      <div class="pickers">
        <select id="example" aria-label="load an example"></select>
        <select id="size" aria-label="how many qubits" title="how many qubits to build this example on"></select>
      </div>
      <textarea id="qasm" spellcheck="false" aria-label="circuit in OpenQASM 2.0"></textarea>
    </div>

    <div class="hsplit" role="separator" aria-orientation="horizontal"></div>
    <div class="panel" id="panelSpec">
      <header>
        <span class="label">Specification</span>
        <span class="spacer"></span>
        <span class="hint" title="the set of states this automaton accepts, in HSL">HSL</span>
      </header>
      <textarea id="specText" spellcheck="false" aria-label="the set of states, in HSL"></textarea>
      <p class="error" id="error" role="alert"></p>
    </div>
  </section>

  <div class="vsplit" id="vsplit" role="separator" aria-orientation="vertical"></div>

  <main class="plate">
    <nav class="circuit" id="circuit" data-min="36"
      aria-label="circuit; click a column to pick that step"></nav>
    <div class="canvas" id="canvas"></div>
  </main>

  <footer class="transport">
    <button id="prev" title="previous gate (←)">‹</button>
    <button id="next" title="next gate (→)">›</button>
    <span class="stat" id="position"></span>
    <span class="spacer"></span>
    <span class="stat" id="stats"></span>
  </footer>
</div>
<script type="module">
  import { boot } from './src/aut-ui.js';
  boot();
</script>
</body>
</html>
